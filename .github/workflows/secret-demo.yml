name: Use Repository Secret

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/secret-demo.yml"

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the secret is available
        env:
          LAB_API_KEY: ${{ secrets.LAB_API_KEY }}
        run: |
          if [ -n "$LAB_API_KEY" ]; then
            echo "Secret is available to the workflow."
          else
            echo "Secret is missing."
            exit 1
          fi